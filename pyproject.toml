[project]
name = "dubizzle-car-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "litellm>=1.100.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.4",
]

[project.scripts]
dubizzle-car-assistant = "dubizzle_car_assistant:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
